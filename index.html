<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Bird</title>
    <link rel="icon" href="img/flappybird.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bona+Nova+SC:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animation.css">
</head>
<body>
<main class="game" id="game">
    <div class="world" id="world"></div>

    <img src="img/flappybird.png" alt="" class="bird" id="bird" draggable="false">

    <div class="score" id="score" hidden>0</div>

    <div class="hint" id="hint" hidden>
        <p>Espaço, clique ou toque<br>para voar</p>
    </div>

    <div class="overlay" id="pause" hidden>
        <div class="panel">
            <h2>Pausado</h2>
            <p class="small">Aperte espaço ou toque para continuar</p>
        </div>
    </div>

    <div class="overlay" id="menu">
        <div class="panel">
            <div class="title float">
                <h1>Flappy</h1>
                <h2>Bird</h2>
            </div>

            <div class="result" id="result" hidden>
                <p class="result-label">Fim de jogo</p>
                <p class="result-score">Pontuação: <span id="final-score">0</span></p>
                <p class="new-record pulse" id="new-record" hidden>Novo recorde!</p>
            </div>

            <p class="record" id="recorde">Recorde: 0</p>

            <div class="controls">
                <button type="button" class="btn btn-play" id="play">Jogar</button>
                <button type="button" class="btn btn-reset" id="reset">Resetar recorde</button>
            </div>
        </div>
    </div>
</main>

<script src="game.js"></script>
</body>
</html>
